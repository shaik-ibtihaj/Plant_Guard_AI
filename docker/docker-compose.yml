version: "3.9"

services:
  # ─────────────────────────────────────────
  # FastAPI Backend Service
  # ─────────────────────────────────────────
  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: plant_guard_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=development
      - PLANT_GUARD_CORS_ORIGINS=http://localhost:3000
      - DATABASE_URL=postgresql+psycopg://postgres:postgres@db:5432/plant_guard
    volumes:
      - ../backend/app:/app/backend/app:ro
      - ../ai:/app/ai:ro
      - ../models/best_model.pth:/app/models/best_model.pth:ro
      - ../models/production_model.json:/app/models/production_model.json:ro
      - ../datasets/metadata:/app/datasets/metadata:ro
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    networks:
      - plant_guard_network

  # ─────────────────────────────────────────
  # React Frontend Service
  # ─────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: plant_guard_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - plant_guard_network

  # ─────────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: plant_guard_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: plant_guard
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d plant_guard"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - plant_guard_network

# Redis and a task queue can be added if inference becomes asynchronous.

networks:
  plant_guard_network:
    driver: bridge

volumes:
  postgres_data:
